<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
       <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
   <style>
:root {
    --primary-blue: #051f20;
    --accent-blue: #163832;
    --bg-gray: #daf1de; 
    --card-white: #ffffff;
    --text-dark: #051f20;
    --text-muted: #235347;
    --border-color: #8eb69b;
}

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-gray);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background-color: var(--primary-blue);
            position: sticky;
            top: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: #ffffff;
            font-size: 1.25rem;
            font-weight: 700;
            text-decoration: none;
        }

        .nav-menu ul {
            display: flex;
            list-style: none;
            gap: 15px;
        }

        .nav-menu a {
            color: #e2e8f0;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .nav-menu a:hover,
        .nav-menu a.active {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.2);
        }

        .page-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
        }

        .section-container {
            width: 100%;
            max-width: 900px;
        }

        .content-card {
            background-color: var(--card-white);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }

        .section-title {
            font-size: 2rem;
            color: var(--primary-blue);
            margin-bottom: 25px;
            position: relative;
            display: inline-block;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 45px;
            height: 3px;
            background-color: var(--accent-blue);
            border-radius: 2px;
        }

        .contact-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-top: 15px;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .info-icon {
            width: 45px;
            height: 45px;
            background-color: #ebf8ff;
            color: var(--accent-blue);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .info-text h4 {
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .info-text p {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--primary-blue);
        }

        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        .form-group input,
        .form-group textarea {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--accent-blue);
        }

        .btn-submit {
            background-color: var(--primary-blue);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: var(--accent-blue);
        }

        .footer {
            text-align: center;
            padding: 20px;
            background-color: var(--primary-blue);
            color: #ffffff;
            font-size: 0.9rem;
            margin-top: auto;
        }

        .footer p {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}

    </style>
</head>
<body>

    <header class="header">
        <div class="nav-container">
            <a href="Index.html" class="logo">Cristiane Come</a>
            <nav class="nav-menu">
                <ul>
                    <li><a href="Index.html">Início</a></li>
                    <li><a href="sobre.html">Sobre</a></li>
                    <li><a href="habilidades.html">Habilidades</a></li>
                    <li><a href="projectos.html">Projectos</a></li>
                    <li><a href="galeria.html">Galeria</a></li>
                    <li><a href="contacto.html" class="active">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="page-content">
        <section class="section-container">
            <div class="content-card">
                <h2 class="section-title">Entre em Contacto</h2>
                
                <div class="contact-container">
                    
                    <div class="contact-info">
                   <div class="info-item">
                   <div class="info-icon"><i class="fa-solid fa-envelope"></i></div>
                <div class="info-text">
                <h4>Email</h4>
                <a href="https://mail.google.com/mail/?view=cm&fs=1&to=comecristiane@gmail.com" target="_blank" class="contact-link">
                         comecristiane@gmail.com
                </a>
             </div>
                </div>

    <div class="info-item">
        <div class="info-icon"><i class="fa-brands fa-whatsapp"></i></div>
        <div class="info-text">
            <h4>WhatsApp / Telefone</h4>
            <a href="https://wa.me/258841497225" target="_blank" class="contact-link">
                +258 84 149 7225
            </a>
        </div>
    </div>
                        <div class="info-item">
                            <div class="info-icon"><i class="fa-solid fa-location-dot"></i></div>
                            <div class="info-text">
                                <h4>Localização</h4>
                                <p>Maputo, Moçambique</p>
                            </div>
                        </div>

                        <div class="info-item">
                            <div class="info-icon"><i class="fa-solid fa-graduation-cap"></i></div>
                            <div class="info-text">
                                <h4>Instituição</h4>
                                <p>ITC (Instituto de Transportes e Comunicações)</p>
                            </div>
                        </div>
                    </div>

                    <form class="contact-form" action="#" method="POST">
                        <div class="form-group">
                            <label for="nome">Nome</label>
                            <input type="text" id="nome" placeholder="O teu nome" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" placeholder="O teu email" required>
                        </div>

                        <div class="form-group">
                            <label for="mensagem">Mensagem</label>
                            <textarea id="mensagem" rows="4" placeholder="Escreve a tua mensagem aqui..." required></textarea>
                        </div>

                        <button type="submit" class="btn-submit">Enviar Mensagem</button>
                    </form>

                </div>
            </div>
        </section>
    </main>
 
<footer class="footer">
    <p>Cristiane Come &copy; 2026</p>
</footer>

</body>
</html>
