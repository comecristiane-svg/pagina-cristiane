<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria</title>
       <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
     <style>
:root {
    --primary-blue: #051f20;
    --accent-blue: #163832;
    --bg-gray: #daf1de; 
    --card-white: #ffffff;
    --text-dark: #051f20;
    --text-muted: #235347;
    --border-color: #8eb69b;
}
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-gray);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background-color: var(--primary-blue);
            position: sticky;
            top: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: #ffffff;
            font-size: 1.25rem;
            font-weight: 700;
            text-decoration: none;
        }

        .nav-menu ul {
            display: flex;
            list-style: none;
            gap: 15px;
        }

        .nav-menu a {
            color: #e2e8f0;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .nav-menu a:hover,
        .nav-menu a.active {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.2);
        }

        .page-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
        }

        .section-container {
            width: 100%;
            max-width: 1000px;
        }

        .content-card {
            background-color: var(--card-white);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }

        .section-title {
            font-size: 2rem;
            color: var(--primary-blue);
            margin-bottom: 25px;
            position: relative;
            display: inline-block;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 45px;
            height: 3px;
            background-color: var(--accent-blue);
            border-radius: 2px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        .gallery-item {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            background-color: var(--bg-gray);
            border: 1px solid var(--border-color);
            aspect-ratio: 4 / 3;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(15, 23, 42, 0.8));
            color: #ffffff;
            padding: 20px 15px 12px 15px;
            font-size: 0.9rem;
            font-weight: 500;
        }

         .footer {
            text-align: center;
            padding: 20px;
            background-color: var(--primary-blue);
            color: #ffffff;
            font-size: 0.9rem;
            margin-top: auto;
        } 

         .footer p {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="nav-container">
            <a href="Index.html" class="logo">Cristiane Come</a>
            <nav class="nav-menu">
                <ul>
                    <li><a href="Index.html">Início</a></li>
                    <li><a href="sobre.html">Sobre</a></li>
                    <li><a href="habilidades.html">Habilidades</a></li>
                    <li><a href="projectos.html">Projectos</a></li>
                    <li><a href="galeria.html" class="active">Galeria</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="page-content">
        <section class="section-container">
            <div class="content-card">
                <h2 class="section-title">Galeria de Fotos</h2>
                
                <div class="gallery-grid">
                    
                    <div class="gallery-item">
                        <img src="Imagens/Foto2.jpeg" alt="Atividade Académica">
                    </div>

                    <div class="gallery-item">
                        <img src="Imagens/momento de estudo.jpg" alt="Momentos de Estudo">
                    </div>

                    <div class="gallery-item">
                        <img src="Imagens/leiruras.jpg" alt="Leituras Favoritas">
                    </div>

                    <div class="gallery-item">
                        <img src="Imagens/Foto3.jpg" alt="Eventos e Atividades">
                    </div>

                </div>
            </div>
        </section>
    </main>
    
    <footer class="footer">
    <p>Cristiane Come &copy; 2026</p>

</body>
</html>
